<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <rect width="2500" height="1686" fill="#FAF8F3"/>

  <!-- cell backgrounds: 左上から時計回りに ハハナビトップ/ご意見箱/支援制度診断/申請制度登録ツール -->
  <rect x="0" y="0" width="1250" height="843" fill="#FAECE7"/>
  <rect x="1250" y="0" width="1250" height="843" fill="#E6F1FB"/>
  <rect x="1250" y="843" width="1250" height="843" fill="#FCEAE3"/>
  <rect x="0" y="843" width="1250" height="843" fill="#E9F3EA"/>

  <!-- dividers -->
  <rect x="1246" y="0" width="8" height="1686" fill="#FFFFFF"/>
  <rect x="0" y="839" width="2500" height="8" fill="#FFFFFF"/>

  <!-- cell 1 (top-left): ハハナビトップ(くまアイコン) -->
  <g transform="translate(625,300)">
    <circle cx="-35" cy="-50" r="23" fill="#D85A30"/>
    <circle cx="35" cy="-50" r="23" fill="#D85A30"/>
    <circle cx="0" cy="0" r="65" fill="#F0997B"/>
    <circle cx="-23.5" cy="-10" r="9.5" fill="#4A1B0C"/>
    <circle cx="23.5" cy="-10" r="9.5" fill="#4A1B0C"/>
    <ellipse cx="0" cy="20" rx="18" ry="12" fill="#FAECE7"/>
  </g>
  <text x="625" y="490" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="92" font-weight="700" fill="#2B2924">ハハナビTOP</text>
  <text x="625" y="568" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="50" fill="#5F5E5A">シングルマザー向け支援制度、お役立ち記事、</text>
  <text x="625" y="628" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="50" fill="#5F5E5A">おすすめ資格、おすすめ求人のポータルサイト</text>

  <!-- cell 2 (top-right): ご意見箱 -->
  <circle cx="1875" cy="300" r="86" fill="#0C447C"/>
  <g transform="translate(1875,290)" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="-45" y="-35" width="90" height="56" rx="14"/>
    <path d="M-28,21 L-38,40 L-10,21"/>
  </g>
  <text x="1875" y="490" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="92" font-weight="700" fill="#2B2924">ご意見箱</text>
  <text x="1875" y="568" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="55" fill="#5F5E5A">ハハナビへのご要望や</text>
  <text x="1875" y="628" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="55" fill="#5F5E5A">今のお悩みについて送ってね</text>

  <!-- cell 3 (bottom-right): 支援制度診断 -->
  <circle cx="1875" cy="1143" r="86" fill="#F3C65C"/>
  <g transform="translate(1875,1143)" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="-15" cy="-15" r="48"/>
    <path d="M22 22 L55 55"/>
  </g>
  <text x="1875" y="1333" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="92" font-weight="700" fill="#2B2924">支援制度診断</text>
  <text x="1875" y="1413" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="58" fill="#5F5E5A">ボタンをポチポチ、</text>
  <text x="1875" y="1478" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="58" fill="#5F5E5A">関係する制度をまとめて表示</text>

  <!-- cell 4 (bottom-left): 申請制度更新リマインダー(クリップボード+チェック)。開発中のためボタンは無反応にしてある -->
  <circle cx="625" cy="1143" r="86" fill="#1F7A3D"/>
  <g transform="translate(625,1143)" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="-38" y="-48" width="76" height="96" rx="10"/>
    <rect x="-16" y="-58" width="32" height="16" rx="6" fill="white" stroke="none"/>
    <path d="M-18 -4 L-5 10 L20 -22"/>
  </g>
  <rect x="970" y="878" width="220" height="68" rx="34" fill="#8A6D1F"/>
  <text x="1080" y="922" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="44" font-weight="700" fill="white">開発中</text>
  <text x="625" y="1333" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="80" font-weight="700" fill="#2B2924">申請制度更新リマインダー</text>
  <text x="625" y="1413" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="58" fill="#5F5E5A">支援制度を登録しておくと</text>
  <text x="625" y="1478" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="58" fill="#5F5E5A">更新時期にお知らせ</text>
</svg>
