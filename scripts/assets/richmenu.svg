<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <rect width="2500" height="1686" fill="#FAF8F3"/>

  <!-- cell backgrounds -->
  <rect x="0" y="0" width="1250" height="843" fill="#FCEAE3"/>
  <rect x="1250" y="0" width="1250" height="843" fill="#FAECE7"/>
  <rect x="0" y="843" width="1250" height="843" fill="#FDF3D9"/>
  <rect x="1250" y="843" width="1250" height="843" fill="#E6F1FB"/>

  <!-- dividers -->
  <rect x="1246" y="0" width="8" height="1686" fill="#FFFFFF"/>
  <rect x="0" y="839" width="2500" height="8" fill="#FFFFFF"/>

  <!-- cell 1: 支援制度診断 -->
  <circle cx="625" cy="300" r="86" fill="#F3C65C"/>
  <g transform="translate(625,300)" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="-15" cy="-15" r="48"/>
    <path d="M22 22 L55 55"/>
  </g>
  <text x="625" y="490" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="92" font-weight="700" fill="#2B2924">支援制度診断</text>
  <text x="625" y="575" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="48" fill="#5F5E5A">もらえるお金を調べる</text>

  <!-- cell 2: お役立ち記事 -->
  <circle cx="1875" cy="300" r="86" fill="#D85A30"/>
  <g transform="translate(1821,241)" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="0" y="0" width="108" height="118" rx="10"/>
    <path d="M22 35 H86 M22 59 H86 M22 83 H66"/>
  </g>
  <text x="1875" y="490" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="92" font-weight="700" fill="#2B2924">お役立ち記事</text>
  <text x="1875" y="575" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="48" fill="#5F5E5A">知って得する話</text>

  <!-- cell 3: 求人リスト(カバン) -->
  <circle cx="625" cy="1143" r="86" fill="#8A6D1F"/>
  <g transform="translate(625,1143)">
    <rect x="-20" y="-55" width="40" height="24" rx="10" fill="white"/>
    <rect x="-13" y="-47" width="26" height="12" rx="6" fill="#8A6D1F"/>
    <rect x="-48" y="-28" width="96" height="60" rx="8" fill="white"/>
    <rect x="-8" y="-18" width="16" height="12" rx="3" fill="#8A6D1F"/>
  </g>
  <text x="625" y="1333" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="92" font-weight="700" fill="#2B2924">求人リスト</text>
  <text x="625" y="1418" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="48" fill="#5F5E5A">近日公開</text>

  <!-- cell 4: ご意見箱 -->
  <circle cx="1875" cy="1143" r="86" fill="#0C447C"/>
  <g transform="translate(1805,1073)" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M140 100 A14 14 0 0 1 126 114 H40 L0 140 V20 A14 14 0 0 1 14 6 H126 A14 14 0 0 1 140 20 Z"/>
  </g>
  <text x="1875" y="1333" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="92" font-weight="700" fill="#2B2924">ご意見箱</text>
  <text x="1875" y="1418" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="48" fill="#5F5E5A">悩み・要望を送る</text>
</svg>
